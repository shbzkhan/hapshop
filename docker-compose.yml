services:
  redis:
    image: redis:8-alpine
    container_name: hapshop-redis
    ports: 
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17
    container_name: hapshop-postgres
    ports:
      - "5432:5432"
    environment:
      DATABASE_NAME: hapshop

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  postgres-data:
